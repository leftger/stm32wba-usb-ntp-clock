[package]
name = "stm32wba-usb-ntp-clock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stm32wba-usb-ntp-clock"
path = "src/main.rs"

[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt", "stm32wba65ri", "memory-x", "time-driver-any", "exti"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt"] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", branch = "main", features = ["defmt", "tcp", "udp", "dhcpv4", "dns", "medium-ethernet", "ipv4"] }

embedded-gui = { path = "../../my-repos/embedded-gui/crates/embedded-gui", default-features = false, features = ["libm", "rich-widgets", "embedded-graphics"] }

embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
mipidsi = "0.9.0"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.2.0"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"
heapless = "0.9"

[build-dependencies]
cortex-m-rt = "0.7.5"

[profile.dev]
opt-level = 2
debug = true
lto = "thin"
panic = "abort"

[profile.release]
opt-level = 3
debug = true
lto = true
codegen-units = 1
panic = "abort"

[patch."https://github.com/embassy-rs/embassy"]
embassy-stm32 = { path = "../../embassy-project/embassy/embassy-stm32" }
embassy-executor = { path = "../../embassy-project/embassy/embassy-executor" }
embassy-time = { path = "../../embassy-project/embassy/embassy-time" }
embassy-futures = { path = "../../embassy-project/embassy/embassy-futures" }
embassy-sync = { path = "../../embassy-project/embassy/embassy-sync" }
embassy-usb = { path = "../../embassy-project/embassy/embassy-usb" }
embassy-net = { path = "../../embassy-project/embassy/embassy-net" }
embassy-usb-synopsys-otg = { path = "../../embassy-project/embassy/embassy-usb-synopsys-otg" }
